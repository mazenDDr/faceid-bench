name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Core ML only exists on macOS, and the datasets live on the GPU machine: the tests that
      # need them skip themselves. OpenCV needs libGL on the runner.
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libgl1
          python -m pip install --upgrade pip
          pip install -e ".[dev,vision]"

      # The same gate as `make check`, so local and CI cannot drift.
      - name: Check
        run: make check
