[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "faceid-bench"
version = "0.1.0"
description = "Measured face detection + verification pipeline, timed on Apple Neural Engine and CUDA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
vision = [
  "opencv-python>=4.10",
  "onnxruntime>=1.20",
]
apple = [
  "coremltools>=8.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/faceid_bench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
